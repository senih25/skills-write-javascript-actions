name: Build bundled action

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "src/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build bundle
        run: npm run build

      - name: Commit generated bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json dist/index.js
          git diff --cached --quiet || git commit -m "Build bundled action"
          git push
